# Builds the Sphinx documentation so that a broken docs build fails CI rather
# than silently producing a broken page on Read the Docs.
#
# Read the Docs itself rebuilds and publishes https://gyraph.readthedocs.io
# on every push to main, via the GitHub webhook installed when the project is
# imported there.

name: Build Documentation

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docs/**'
      - 'gyraph/**'
      - '.readthedocs.yaml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'docs/**'
      - 'gyraph/**'
      - '.readthedocs.yaml'
      - '.github/workflows/docs.yml'

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build HTML
        # -W turns docstring/reST warnings into failures so that a malformed
        # docstring is caught here rather than silently degrading the site.
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

      - name: Check for broken internal references
        run: sphinx-build -b linkcheck -D linkcheck_ignore='https://ieeexplore.ieee.org/.*' docs docs/_build/linkcheck
        continue-on-error: true

      - name: Upload built documentation
        uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: docs/_build/html
